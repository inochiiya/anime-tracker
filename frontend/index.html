<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>追番收藏</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="icon" href="/assets/logo.svg">
</head>
<body>
    <header class="navbar">
        <a href="/" class="logo">
            <img src="/assets/logo.svg" alt="追番收藏">
            <span>追番收藏</span>
        </a>
        <nav>
            <a href="/">首页</a>
            <a href="/list">番剧列表</a>
            <a href="/admin">管理</a>
            <a href="/changelog">更新日志</a>
        </nav>
    </header>

    <main>
        <section class="section greeting-section">
            <div class="greeting" id="greeting">
                <h1>欢迎回来</h1>
                <p class="greeting-stats" id="greeting-stats">加载中...</p>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">正在追</h2>
            <div class="watching-scroll" id="watching-scroll"></div>
        </section>

        <section class="section">
            <h2 class="section-title">最近更新</h2>
            <div class="anime-grid" id="recent-grid"></div>
        </section>
    </main>

    <footer class="footer">
        <p>用 <span>heart</span> 追番 | 追番收藏 &copy; 2026</p>
    </footer>

    <div id="toast-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/home.js"></script>
</body>
</html>
