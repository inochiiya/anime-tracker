<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番剧列表 - 追番收藏</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/list.css">
    <link rel="icon" href="/assets/logo.svg">
</head>
<body>
    <header class="navbar">
        <a href="/" class="logo">
            <img src="/assets/logo.svg" alt="追番收藏">
            <span>追番收藏</span>
        </a>
        <nav>
            <a href="/">首页</a>
            <a href="/list">番剧列表</a>
            <a href="/admin">管理</a>
            <a href="/changelog">更新日志</a>
        </nav>
    </header>

    <main class="page-container">
        <div class="section">
            <h1 class="page-title">番剧列表</h1>

            <div class="filter-bar">
                <div class="filter-group">
                    <input type="text" id="search-input" placeholder="搜索番剧名称..." class="search-input">
                </div>
                <div class="filter-group">
                    <select id="status-filter">
                        <option value="">全部状态</option>
                        <option value="watching">追番中</option>
                        <option value="completed">已看完</option>
                        <option value="planned">计划看</option>
                        <option value="dropped">已弃</option>
                    </select>
                </div>
                <div class="filter-group">
                    <select id="genre-filter">
                        <option value="">全部类型</option>
                    </select>
                </div>
                <div class="filter-group">
                    <select id="year-filter">
                        <option value="">全部年份</option>
                    </select>
                </div>
                <div class="filter-group">
                    <select id="sort-filter">
                        <option value="updated_at">最近更新</option>
                        <option value="rating">评分最高</option>
                        <option value="title">名称排序</option>
                        <option value="year">年份最新</option>
                    </select>
                </div>
            </div>

            <div class="result-info" id="result-info"></div>
            <div class="anime-grid" id="anime-grid"></div>
            <div id="pagination"></div>
        </div>
    </main>

    <footer class="footer">
        <p>用 <span>❤</span> 追番 | 追番收藏 &copy; 2026</p>
    </footer>

    <div id="toast-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/list.js"></script>
</body>
</html>
