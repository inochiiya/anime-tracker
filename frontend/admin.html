<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 追番收藏</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="icon" href="/assets/logo.svg">
</head>
<body>
    <header class="navbar">
        <a href="/" class="logo">
            <img src="/assets/logo.svg" alt="追番收藏">
            <span>追番收藏</span>
        </a>
        <nav>
            <a href="/">首页</a>
            <a href="/list">番剧列表</a>
            <a href="/admin">管理</a>
            <a href="/changelog">更新日志</a>
        </nav>
    </header>

    <main class="page-container">
        <div class="section">
            <!-- Tabs -->
            <div class="admin-tabs">
                <button class="admin-tab active" data-tab="anime" onclick="switchAdminTab('anime')">番剧管理</button>
                <button class="admin-tab" data-tab="changelog" onclick="switchAdminTab('changelog')">更新日志</button>
            </div>

            <!-- Anime Management -->
            <div id="tab-anime" class="admin-tab-content active">
                <div class="admin-header">
                    <h1 class="page-title">番剧管理</h1>
                    <div class="admin-actions">
                        <button class="btn btn-secondary" onclick="exportData()">导出数据</button>
                        <label class="btn btn-secondary" style="cursor:pointer">
                            导入数据
                            <input type="file" accept=".json" onchange="importData(event)" style="display:none">
                        </label>
                        <button class="btn btn-primary" onclick="openCreateModal()">+ 新增番剧</button>
                    </div>
                </div>

                <div class="admin-filters">
                    <input type="text" id="admin-search" placeholder="搜索番剧..." class="search-input">
                    <select id="admin-status-filter">
                        <option value="">全部状态</option>
                        <option value="watching">追番中</option>
                        <option value="completed">已看完</option>
                        <option value="planned">计划看</option>
                        <option value="dropped">已弃</option>
                    </select>
                </div>

                <div class="admin-table-wrap">
                    <table class="admin-table" id="admin-table">
                        <thead>
                            <tr>
                                <th>封面</th>
                                <th>名称</th>
                                <th>状态</th>
                                <th>进度</th>
                                <th>评分</th>
                                <th>年份</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="admin-tbody"></tbody>
                    </table>
                </div>

                <div id="admin-pagination"></div>
            </div>

            <!-- Changelog Management -->
            <div id="tab-changelog" class="admin-tab-content">
                <div class="admin-header">
                    <h1 class="page-title">更新日志</h1>
                    <div class="admin-actions">
                        <button class="btn btn-primary" onclick="openChangelogModal()">+ 新增日志</button>
                    </div>
                </div>
                <div id="changelog-list"></div>
            </div>
        </div>
    </main>

    <!-- Anime Form Modal -->
    <div class="modal-overlay" id="form-modal">
        <div class="modal" style="max-width: 700px;">
            <h2 class="modal-title" id="modal-title">新增番剧</h2>
            <form id="anime-form" onsubmit="handleSubmit(event)">
                <input type="hidden" id="form-id">
                <!-- Tab navigation inside modal -->
                <div class="modal-tabs" id="modal-tabs" style="display:none;">
                    <button type="button" class="modal-tab active" data-tab="info" onclick="switchModalTab('info')">基本信息</button>
                    <button type="button" class="modal-tab" data-tab="characters" onclick="switchModalTab('characters')">角色</button>
                    <button type="button" class="modal-tab" data-tab="episodes" onclick="switchModalTab('episodes')">集数笔记</button>
                </div>

                <!-- Info Tab -->
                <div id="modal-tab-info" class="modal-tab-content active">
                    <div class="form-group">
                        <label for="form-title">番剧名称 *</label>
                        <input type="text" id="form-title" maxlength="200">
                    </div>
                    <div class="form-group">
                        <label for="form-title-jp">日文原名</label>
                        <input type="text" id="form-title-jp" maxlength="200">
                    </div>
                    <div class="form-group">
                        <label for="form-cover">封面图片 URL</label>
                        <input type="url" id="form-cover" placeholder="https://..." oninput="previewCover(this.value)">
                        <div id="cover-preview"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="form-status">状态</label>
                            <select id="form-status">
                                <option value="planned">计划看</option>
                                <option value="watching">追番中</option>
                                <option value="completed">已看完</option>
                                <option value="dropped">已弃</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="form-rating">评分 (0-10)</label>
                            <input type="number" id="form-rating" min="0" max="10" step="0.1" value="0">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="form-episodes">总集数</label>
                            <input type="number" id="form-episodes" min="0">
                        </div>
                        <div class="form-group">
                            <label for="form-watched">已看集数</label>
                            <input type="number" id="form-watched" min="0" value="0">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="form-year">年份</label>
                            <input type="number" id="form-year" min="1990" max="2030">
                        </div>
                        <div class="form-group">
                            <label for="form-season">季度</label>
                            <select id="form-season">
                                <option value="">未选择</option>
                                <option value="winter">冬季 (1月)</option>
                                <option value="spring">春季 (4月)</option>
                                <option value="summer">夏季 (7月)</option>
                                <option value="fall">秋季 (10月)</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="form-start-date">开始观看</label>
                            <input type="date" id="form-start-date">
                        </div>
                        <div class="form-group">
                            <label for="form-finish-date">看完日期</label>
                            <input type="date" id="form-finish-date">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="form-air-date">首播日期</label>
                            <input type="date" id="form-air-date">
                        </div>
                        <div class="form-group">
                            <label for="form-studio">制作公司</label>
                            <input type="text" id="form-studio" maxlength="100">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="form-genre">类型标签 (逗号分隔)</label>
                        <input type="text" id="form-genre" placeholder="奇幻,冒险,恋爱" maxlength="200">
                    </div>
                    <div class="form-group">
                        <label for="form-personal-tags">私人标签 (逗号分隔)</label>
                        <input type="text" id="form-personal-tags" placeholder="催泪神作,童年回忆" maxlength="300">
                    </div>
                    <div class="form-group">
                        <label for="form-link">外部链接</label>
                        <input type="url" id="form-link" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label for="form-synopsis">简介</label>
                        <textarea id="form-synopsis" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="form-notes">个人备注</label>
                        <textarea id="form-notes" rows="3"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group checkbox-group">
                            <label>
                                <input type="checkbox" id="form-featured">
                                设为推荐
                            </label>
                        </div>
                        <div class="form-group checkbox-group">
                            <label>
                                <input type="checkbox" id="form-favorite">
                                标记为最爱
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Characters Tab -->
                <div id="modal-tab-characters" class="modal-tab-content">
                    <div class="sub-section-header">
                        <span class="sub-section-title">角色列表</span>
                        <button type="button" class="btn btn-secondary btn-sm" onclick="openCharacterForm()">+ 添加角色</button>
                    </div>
                    <div id="characters-list" class="characters-list"></div>
                    <div id="character-form-area" style="display:none;">
                        <div class="sub-form">
                            <input type="hidden" id="char-form-id">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>角色名 *</label>
                                    <input type="text" id="char-form-name" maxlength="100">
                                </div>
                                <div class="form-group">
                                    <label>日文名</label>
                                    <input type="text" id="char-form-name-jp" maxlength="100">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>头像 URL</label>
                                    <input type="url" id="char-form-avatar" placeholder="https://...">
                                </div>
                                <div class="form-group">
                                    <label>角色身份</label>
                                    <input type="text" id="char-form-role" placeholder="主角/配角/路人" maxlength="50">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>简介</label>
                                <textarea id="char-form-desc" rows="2"></textarea>
                            </div>
                            <div class="form-actions">
                                <button type="button" class="btn btn-secondary btn-sm" onclick="closeCharacterForm()">取消</button>
                                <button type="button" class="btn btn-primary btn-sm" onclick="saveCharacter()">保存</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Episodes Tab -->
                <div id="modal-tab-episodes" class="modal-tab-content">
                    <div class="sub-section-header">
                        <span class="sub-section-title">集数笔记</span>
                        <button type="button" class="btn btn-secondary btn-sm" onclick="openEpisodeForm()">+ 添加笔记</button>
                    </div>
                    <div id="episodes-list" class="episodes-list"></div>
                    <div id="episode-form-area" style="display:none;">
                        <div class="sub-form">
                            <input type="hidden" id="ep-form-id">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>集数 *</label>
                                    <input type="number" id="ep-form-episode" min="1">
                                </div>
                                <div class="form-group">
                                    <label>单集评分 (0-10)</label>
                                    <input type="number" id="ep-form-rating" min="0" max="10" step="0.1">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>观看日期</label>
                                <input type="date" id="ep-form-date">
                            </div>
                            <div class="form-group">
                                <label>笔记</label>
                                <textarea id="ep-form-note" rows="3"></textarea>
                            </div>
                            <div class="form-group">
                                <label>上传图片</label>
                                <input type="file" id="ep-form-images" accept="image/*" multiple onchange="uploadEpisodeImages(this)">
                                <div id="ep-images-preview" class="ep-images-preview"></div>
                            </div>
                            <div class="form-actions">
                                <button type="button" class="btn btn-secondary btn-sm" onclick="closeEpisodeForm()">取消</button>
                                <button type="button" class="btn btn-primary btn-sm" onclick="saveEpisodeNote()">保存</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-actions" id="anime-form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeFormModal()">取消</button>
                    <button type="submit" class="btn btn-primary" id="form-submit-btn">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal" style="max-width: 400px; text-align: center;">
            <h2 class="modal-title">确认删除</h2>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem;" id="delete-message">
                确定要删除吗？此操作不可撤销。
            </p>
            <div class="form-actions" style="justify-content: center;">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">取消</button>
                <button class="btn btn-danger" onclick="confirmDelete()">删除</button>
            </div>
        </div>
    </div>

    <!-- Changelog Modal -->
    <div class="modal-overlay" id="changelog-modal">
        <div class="modal" style="max-width: 500px;">
            <h2 class="modal-title" id="changelog-modal-title">新增更新日志</h2>
            <form onsubmit="handleChangelogSubmit(event)">
                <input type="hidden" id="log-form-id">
                <div class="form-group">
                    <label for="log-form-title">标题 *</label>
                    <input type="text" id="log-form-title" required maxlength="200">
                </div>
                <div class="form-group">
                    <label for="log-form-version">版本号</label>
                    <input type="text" id="log-form-version" placeholder="v1.0.0" maxlength="20">
                </div>
                <div class="form-group">
                    <label for="log-form-content">内容</label>
                    <textarea id="log-form-content" rows="6"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeChangelogModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Admin Token Modal -->
    <div class="modal-overlay active" id="token-modal">
        <div class="modal" style="max-width: 400px;">
            <h2 class="modal-title">管理令牌</h2>
            <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 1rem;">
                请输入管理令牌（可在 backend/admin_token.txt 中查看）。
            </p>
            <div class="form-group">
                <input type="password" id="token-input" placeholder="请输入令牌" autocomplete="off">
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-primary" onclick="submitToken()">验证</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>用 <span>heart</span> 追番 | 追番收藏 &copy; 2026</p>
    </footer>

    <div id="toast-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
